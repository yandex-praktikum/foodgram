volumes:
  pg_data:
  static:
  media:

services:
  db:
    container_name: foodgram-db
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    container_name: foodgram-backend
    build: ./backend/
    env_file: .env
    volumes:
      - static:/static/backend/
      - media:/app/media
    depends_on:
      - db
  frontend:
    container_name: foodgram-frontend
    build: ./frontend/
    command: cp -r /app/build/. /static/frontend/
    volumes:
      - static:/static
  gateway:
    build: ./infra/
    ports:
      - 10000:80
    volumes:
      - static:/static
      - media:/media
    depends_on:
      - backend
      - frontend
